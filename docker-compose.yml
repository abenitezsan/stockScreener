# Despliegue en el VPS, detrás del proxy de entrada (deploy/edge), que es el único que
# publica el puerto 80 y reenvía /stockscreener/ por la red "stockscreener-net".
# Pasos completos en deploy/README.md.
#
#   docker compose pull && docker compose up -d
#
# La base de datos es un fichero SQLite en el volumen "stockscreener-data" (/data), que se
# conserva al actualizar la imagen (se borra con `docker compose down -v`).
name: stockscreener

services:
  stockscreener:
    image: ${STOCKSCREENER_IMAGE:-abenitezsan/stockscreener:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Subruta pública (la misma que en la location de nginx)
      ROOT_PATH: ${ROOT_PATH:-/stockscreener}
      # Solo le llega tráfico del nginx por la red interna: se aceptan sus cabeceras X-Forwarded-*
      FORWARDED_ALLOW_IPS: "*"
      # Logs de la app en fichero con rotación (10 MB x 14): app.log (web y tareas
      # programadas) y cli.log (comandos `python -m app.cli`)
      LOG_DIR: /app/logs
    volumes:
      - stockscreener-data:/data
      # Logs en el host, junto a este fichero. La app corre con uid 10001: antes del primer
      # arranque, `mkdir -p logs && sudo chown 10001:10001 logs` (si no, solo loguea a consola)
      - ./logs:/app/logs
    networks:
      - stockscreener-net
    # Mismo estilo de límites que tabbito; la app usa ~150-250 MB
    cpus: "0.5"
    mem_limit: "512m"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  stockscreener-data:

networks:
  # Nombre fijo para que el proxy de entrada pueda referenciarla
  stockscreener-net:
    name: stockscreener-net
