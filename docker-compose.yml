# Despliegue en el VPS, detrás del proxy de entrada (deploy/edge), que es el único que
# publica el puerto 80 y reenvía /stockscreener/ por la red "stockscreener-net".
# Pasos completos en deploy/README.md.
#
#   docker compose pull && docker compose up -d
#
# Todo lo persistente vive en carpetas del host, junto a este fichero:
#   ./data/stockscreener.db   base de datos SQLite
#   ./logs/                   app.log y cli.log
# La app corre con uid 10001. Antes del primer arranque:
#   mkdir -p data logs && sudo chown 10001:10001 data logs
name: stockscreener

services:
  stockscreener:
    image: ${STOCKSCREENER_IMAGE:-abenitezsan/stockscreener:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Subruta pública (la misma que en la location de nginx)
      ROOT_PATH: ${ROOT_PATH:-/stockscreener}
      # Solo le llega tráfico del nginx por la red interna: se aceptan sus cabeceras X-Forwarded-*
      FORWARDED_ALLOW_IPS: "*"
      # Logs de la app en fichero con rotación (10 MB x 14): app.log (web y tareas
      # programadas) y cli.log (comandos `python -m app.cli`)
      LOG_DIR: /app/logs
    volumes:
      # Base de datos SQLite (junto con sus ficheros -wal y -shm)
      - ./data:/data
      # Logs (sin permisos de escritura, la app solo loguea a consola)
      - ./logs:/app/logs
    networks:
      - stockscreener-net
    # Mismo estilo de límites que tabbito; la app usa ~150-250 MB
    cpus: "0.5"
    mem_limit: "512m"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  # Nombre fijo para que el proxy de entrada pueda referenciarla
  stockscreener-net:
    name: stockscreener-net
