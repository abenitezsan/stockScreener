# Tests y publicación de la imagen en Docker Hub.
#
# Secretos necesarios (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  usuario de Docker Hub
#   DOCKERHUB_TOKEN     access token de Docker Hub con permiso Read & Write
# Variable opcional:
#   DOCKERHUB_IMAGE     nombre de la imagen (por defecto <usuario>/stockscreener)
#
# Etiquetas publicadas:
#   rama por defecto -> latest, sha-<commit>
#   tag v1.2.3       -> 1.2.3, 1.2, sha-<commit>
# Las pull requests y las demás ramas solo compilan la imagen, sin publicarla.

name: CI y Docker Hub

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockscreener_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/stockscreener_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/stockscreener_test
      SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migraciones (subir, comprobar que coinciden con los modelos, bajar)
        run: alembic upgrade head && alembic check && alembic downgrade base
      - name: Tests
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      PUBLISH: >-
        ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != ''
        && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
            || startsWith(github.ref, 'refs/tags/v')) }}
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/stockscreener', secrets.DOCKERHUB_USERNAME || 'local') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Aviso si faltan los secretos
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::Faltan DOCKERHUB_USERNAME/DOCKERHUB_TOKEN; la imagen se compila pero no se publica."

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
