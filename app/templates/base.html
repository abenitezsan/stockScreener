<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stock Screener{% endblock %}</title>
  <link rel="stylesheet" href="{{ ROOT }}/static/vendor/pico-2.0.6.min.css">
  <link rel="stylesheet" href="{{ ROOT }}/static/app.css?v={{ ASSET_V }}">
  <script src="{{ ROOT }}/static/vendor/htmx-2.0.4.min.js" defer></script>
  <script src="{{ ROOT }}/static/app.js?v={{ ASSET_V }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body data-root="{{ ROOT }}">
  <header class="container">
    <nav>
      <ul><li><strong>Stock Screener</strong></li></ul>
      <ul>
        <li><a href="{{ ROOT }}/screener">Screener</a></li>
        <li><a href="{{ ROOT }}/watchlist">Seguimiento</a></li>
        <li><a href="{{ ROOT }}/portfolio">Cartera</a></li>
        {% if is_admin %}<li><a href="{{ ROOT }}/admin/users">Usuarios</a></li>{% endif %}
        {% if user %}
        <li><form method="post" action="{{ ROOT }}/logout" class="logout"><button type="submit" class="link" title="Sesión de {{ user.email }}">Salir<span class="who"> · {{ user.email }}</span></button></form></li>
        {% else %}
        <li><a href="{{ ROOT }}/login?next={{ here }}">Entrar</a></li>
        {% endif %}
      </ul>
    </nav>
  </header>
  {% include "_icons.html" %}
  <main class="container">{% block content %}{% endblock %}</main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
