# Bloques para añadir DENTRO del `server { ... }` existente de tabbito.conf.
# Exponen la app en http://<IP>/stockscreener/ con usuario y contraseña.

    location = /stockscreener {
        absolute_redirect off;
        return 301 /stockscreener/;
    }

    location /stockscreener/ {
        # La app no tiene login propio: sin esto quedaría abierta a internet
        auth_basic "Stock Screener";
        auth_basic_user_file /etc/nginx/stockscreener.htpasswd;

        # Se resuelve el nombre en cada petición (DNS interno de Docker). Así nginx arranca
        # aunque stockscreener esté parado, y un fallo de esta app no tumba tabbito.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $stockscreener_upstream http://stockscreener:8000;

        # Quita el prefijo: /stockscreener/screener -> /screener
        rewrite ^/stockscreener/(.*)$ /$1 break;
        proxy_pass $stockscreener_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
