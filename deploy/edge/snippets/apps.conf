# Rutas de las apps. Lo incluyen el servidor HTTP (conf.d/default.conf) y, si se activa, el
# HTTPS (conf.d/https.conf, que genera enable-https.sh).

# --- tabbito ----------------------------------------------------------------------------
# Misma lógica que el tabbito.conf original: /tabbito sin barra va al login del admin,
# y el prefijo se quita antes de reenviar (/tabbito/api/... -> app:8080/api/...).
location = /tabbito {
    return 301 /tabbito/admin/login.html;
}

location /tabbito/ {
    set $tabbito_upstream http://app:8080;
    rewrite ^/tabbito/(.*)$ /$1 break;
    proxy_pass $tabbito_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- stockscreener ----------------------------------------------------------------------
location = /stockscreener {
    return 301 /stockscreener/;
}

location /stockscreener/ {
    set $stockscreener_upstream http://stockscreener:8000;
    rewrite ^/stockscreener/(.*)$ /$1 break;
    proxy_pass $stockscreener_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Descubrimiento OAuth del conector de Claude (servidor MCP en /stockscreener/mcp). Los
# clientes buscan los metadatos en la raíz del dominio con la subruta al final (RFC 8414 y
# RFC 9728): /.well-known/<tipo>/stockscreener. Se reenvían a la app.
location ~ ^/\.well-known/(?<wk_doc>oauth-authorization-server|openid-configuration)(/stockscreener)?$ {
    set $stockscreener_upstream http://stockscreener:8000;
    rewrite ^ /.well-known/$wk_doc break;
    proxy_pass $stockscreener_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/\.well-known/oauth-protected-resource(/stockscreener)?(/mcp)?$ {
    set $stockscreener_upstream http://stockscreener:8000;
    rewrite ^ /.well-known/oauth-protected-resource/mcp break;
    proxy_pass $stockscreener_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
