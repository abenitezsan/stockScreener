# Proxy de entrada con HTTPS. Necesita el certificado de Let's Encrypt (ver bootstrap.conf y
# deploy/README.md "HTTPS"): nginx no arranca si faltan los ficheros de /etc/letsencrypt.
#
#   https://tabkiper.com/               -> tabbito (en la raíz del dominio: /admin, /site, /api...)
#   https://tabkiper.com/tabbito/       -> tabbito (ruta antigua, se mantiene por compatibilidad)
#   https://tabkiper.com/stockscreener/ -> stockscreener
#   http://<IP>/...                     -> las mismas rutas por HTTP, para acceder por IP
#
# DNS interno de Docker. Con los upstreams en variables, cada nombre se resuelve por
# petición: nginx arranca aunque una app esté parada, y solo esa ruta devuelve 502.

# --- HTTP: reto ACME y redirección a HTTPS para el dominio ---
server {
    listen 80;
    server_name tabkiper.com www.tabkiper.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://tabkiper.com$request_uri;
    }
}

# --- HTTP: monitorización (mon.tabkiper.com). Reto ACME y redirección a HTTPS ---
server {
    listen 80;
    server_name mon.tabkiper.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mon.tabkiper.com$request_uri;
    }
}

# --- HTTP por IP (o cualquier otro host): las rutas de siempre, sin redirigir a HTTPS ---
server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    absolute_redirect off;

    # --- tabbito ----------------------------------------------------------------------
    # /tabbito sin barra va al login del admin, y el prefijo se quita antes de reenviar
    # (/tabbito/api/... -> app:8080/api/...).
    location = /tabbito {
        return 301 /tabbito/admin/login.html;
    }

    location /tabbito/ {
        set $tabbito_upstream http://app:8080;
        rewrite ^/tabbito/(.*)$ /$1 break;
        proxy_pass $tabbito_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- stockscreener ----------------------------------------------------------------
    location = /stockscreener {
        return 301 /stockscreener/;
    }

    location /stockscreener/ {
        set $stockscreener_upstream http://stockscreener:8000;
        rewrite ^/stockscreener/(.*)$ /$1 break;
        proxy_pass $stockscreener_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- HTTPS: www -> dominio sin www (un único origen canónico) ---
server {
    listen 443 ssl;
    http2 on;
    server_name www.tabkiper.com;

    ssl_certificate     /etc/letsencrypt/live/tabkiper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabkiper.com/privkey.pem;

    return 301 https://tabkiper.com$request_uri;
}

# --- HTTPS: mon.tabkiper.com (monitorización de tabbito, con contraseña) ---
# Todo el host va detrás de basic auth; el fichero lo crea el operador (ver deploy/README.md
# "Monitorización") y no se versiona. Necesita que el certificado incluya mon.tabkiper.com.
#   /vm/       -> VictoriaMetrics (vmui en /vm/vmui/), proyecto tabbito-monitoring
#   /traffic/  -> informe de GoAccess sobre access.log, HTML estático generado por ese proyecto
server {
    listen 443 ssl;
    http2 on;
    server_name mon.tabkiper.com;

    resolver 127.0.0.11 valid=10s ipv6=off;
    absolute_redirect off;

    ssl_certificate     /etc/letsencrypt/live/tabkiper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabkiper.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    auth_basic           "Tabkiper monitoring";
    auth_basic_user_file /etc/nginx/auth/monitor.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / {
        return 302 /vm/vmui/;
    }

    # VictoriaMetrics arranca con -http.pathPrefix=/vm, así que se le pasa la URI completa
    # (proxy_pass con variable y sin ruta no reescribe nada).
    location /vm/ {
        set $vm_upstream http://victoriametrics:8428;
        proxy_pass $vm_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /traffic {
        return 301 /traffic/;
    }

    location /traffic/ {
        alias /srv/monitor-report/;
        index index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}

# --- HTTPS: tabkiper.com ---
server {
    listen 443 ssl;
    http2 on;
    server_name tabkiper.com;

    resolver 127.0.0.11 valid=10s ipv6=off;
    absolute_redirect off;

    ssl_certificate     /etc/letsencrypt/live/tabkiper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabkiper.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Descomentar solo cuando HTTPS funcione en todo: el navegador lo recuerda un año.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 5m;

    # stockscreener, antes que "/" para que no lo capture tabbito.
    location = /stockscreener {
        return 301 /stockscreener/;
    }

    location /stockscreener/ {
        set $stockscreener_upstream http://stockscreener:8000;
        rewrite ^/stockscreener/(.*)$ /$1 break;
        proxy_pass $stockscreener_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Conector de Claude (servidor MCP en /stockscreener/mcp). Claude busca los metadatos de
    # OAuth en la raíz del dominio con la subruta al final (RFC 8414 y RFC 9728); sin esto
    # "location /" los mandaría a tabbito. Solo las variantes de /stockscreener: los
    # .well-known de la raíz siguen siendo de tabbito.
    location ~ ^/\.well-known/(?<ss_wk>oauth-authorization-server|openid-configuration)/stockscreener$ {
        set $stockscreener_upstream http://stockscreener:8000;
        rewrite ^ /.well-known/$ss_wk break;
        proxy_pass $stockscreener_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/\.well-known/oauth-protected-resource/stockscreener(/mcp)?$ {
        set $stockscreener_upstream http://stockscreener:8000;
        rewrite ^ /.well-known/oauth-protected-resource/mcp break;
        proxy_pass $stockscreener_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ruta antigua de tabbito (marcadores, ADMIN_BASE_URL anterior).
    location = /tabbito {
        return 301 /admin/login.html;
    }

    location /tabbito/ {
        set $tabbito_upstream http://app:8080;
        rewrite ^/tabbito/(.*)$ /$1 break;
        proxy_pass $tabbito_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La raíz no tiene página propia en la app: manda a la web pública.
    location = / {
        return 302 /site/index.html;
    }

    # Todo lo demás (admin, /site, /webchat, API y webhooks) va a tabbito sin prefijo.
    location / {
        set $tabbito_upstream http://app:8080;
        proxy_pass $tabbito_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
