# Las rutas de las apps están en snippets/apps.conf (las comparte el servidor HTTPS).
server {
    listen 80 default_server;
    server_name _;

    # DNS interno de Docker. Con los upstreams en variables, cada nombre se resuelve por
    # petición: nginx arranca aunque una app esté parada, y solo esa ruta devuelve 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    absolute_redirect off;

    # Validación de Let's Encrypt (enable-https.sh y renovación automática)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/apps.conf;
}
