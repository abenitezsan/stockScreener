# Configuración de arranque, SOLO para conseguir el primer certificado.
# nginx no arranca con conf.d/default.conf hasta que existan los ficheros del certificado,
# así que la primera vez se usa esta (solo HTTP + el reto ACME). Ver deploy/README.md "HTTPS".
server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    absolute_redirect off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /tabbito {
        return 301 /tabbito/admin/login.html;
    }

    location /tabbito/ {
        set $tabbito_upstream http://app:8080;
        rewrite ^/tabbito/(.*)$ /$1 break;
        proxy_pass $tabbito_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /stockscreener {
        return 301 /stockscreener/;
    }

    location /stockscreener/ {
        set $stockscreener_upstream http://stockscreener:8000;
        rewrite ^/stockscreener/(.*)$ /$1 break;
        proxy_pass $stockscreener_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
