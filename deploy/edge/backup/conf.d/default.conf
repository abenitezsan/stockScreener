server {
    listen 80 default_server;
    server_name _;

    # DNS interno de Docker. Con los upstreams en variables, cada nombre se resuelve por
    # petición: nginx arranca aunque una app esté parada, y solo esa ruta devuelve 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    absolute_redirect off;

    # --- tabbito --------------------------------------------------------------------------
    # Misma lógica que el tabbito.conf original: /tabbito sin barra va al login del admin,
    # y el prefijo se quita antes de reenviar (/tabbito/api/... -> app:8080/api/...).
    location = /tabbito {
        return 301 /tabbito/admin/login.html;
    }

    location /tabbito/ {
        set $tabbito_upstream http://app:8080;
        rewrite ^/tabbito/(.*)$ /$1 break;
        proxy_pass $tabbito_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- stockscreener --------------------------------------------------------------------
    location = /stockscreener {
        return 301 /stockscreener/;
    }

    location /stockscreener/ {
        set $stockscreener_upstream http://stockscreener:8000;
        rewrite ^/stockscreener/(.*)$ /$1 break;
        proxy_pass $stockscreener_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
