[project]
name = "stockscreener"
version = "0.1.0"
description = "Screener de acciones (UE, EE. UU., Canadá) y seguimiento de cartera y dividendos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10,<4",
    "yfinance>=0.2.54",
    "pandas>=2.2",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
